<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebNFC: Система оплаты</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            line-height: 1.6;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:disabled {
            background: #ccc;
        }

        #output {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            border: 1px solid #ddd;
            max-height: 300px;
            overflow-y: auto;
        }

        .status {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>NFC Управление картами</h1>
    <div id="supportStatus" class="status"></div>

    <div class="controls">
        <button id="scanButton">💳 Считать карту (Оплата)</button>
        <button id="writeButton">✍️ Записать ID/Данные</button>
        <button id="makeReadOnlyButton">🔒 Сделать только для чтения</button>
    </div>

    <h3>Лог операций:</h3>
    <div id="output">Здесь будут отображаться действия...</div>

    <script>
        const output = document.getElementById('output');
        const statusDiv = document.getElementById('supportStatus');

        // Кастомная функция логгирования
        function log(message) {
            const now = new Date().toLocaleTimeString();
            output.innerText += `[${now}] ${message}\n`;
            output.scrollTop = output.scrollHeight;
        }

        // Проверка поддержки WebNFC
        if (!("NDEFReader" in window)) {
            statusDiv.innerText = "Ошибка: Web NFC не поддерживается. Используйте Chrome на Android и HTTPS.";
            document.querySelectorAll('button').forEach(b => b.disabled = true);
        }

        // --- ЧТЕНИЕ И ОПЛАТА ---
        scanButton.addEventListener("click", async () => {
            log("Запуск сканирования для оплаты...");
            try {
                const ndef = new NDEFReader();
                await ndef.scan();

                ndef.onreading = async ({ message, serialNumber }) => {
                    log(`>>> Карта: ${serialNumber}`);

                    for (const record of message.records) {
                        // 1. Декодируем байты в строку
                        const decoder = new TextDecoder();
                        const textData = decoder.decode(record.data);

                        try {
                            // 2. Превращаем строку в объект JSON
                            let cardObj = JSON.parse(textData);
                            log(`Владелец: ${cardObj.userID}, Баланс: ${cardObj.balance}р`);

                            // 3. Логика оплаты
                            const price = 20;
                            if (cardObj.balance >= price) {
                                cardObj.balance -= price; // Уменьшаем баланс в памяти телефона

                                log(`Списываю ${price}р... Новый баланс: ${cardObj.balance}р`);

                                // 4. ВАЖНО: Чтобы сохранить новый баланс, нужно ЗАПИСАТЬ его обратно на карту!
                                // Мы вызываем запись сразу после чтения
                                await ndef.write(JSON.stringify(cardObj));
                                log("✅ Оплата прошла! Баланс обновлен на карте.");
                            } else {
                                log("❌ Недостаточно средств!");
                            }
                        } catch (e) {
                            log("Ошибка: На карте не JSON данные или карта пуста.");
                        }
                    }
                };
            } catch (error) {
                log("Ошибка: " + error);
            }
        });

        // --- ЗАПИСЬ (Регистрация новой карты) ---
        writeButton.addEventListener("click", async () => {
            log("Приложите карту для инициализации...");
            try {
                const ndef = new NDEFReader();

                // Данные, которые мы хотим сохранить
                const userData = {
                    userID: 'GG234g',
                    balance: 100
                };

                // 5. В NFC можно писать только строку или байты. 
                // Превращаем наш объект в строку JSON.
                await ndef.write(JSON.stringify(userData));

                log("✅ Карта создана: ID " + userData.userID + " с балансом " + userData.balance);
            } catch (error) {
                log("Ошибка записи: " + error);
            }
        });

        // --- БЛОКИРОВКА (Сделать карту вечной) ---
        makeReadOnlyButton.addEventListener("click", async () => {
            log("ВНИМАНИЕ: Делаем карту Read-Only...");
            try {
                const ndef = new NDEFReader();
                await ndef.makeReadOnly();
                log("> Карта теперь защищена от записи навсегда.");
            } catch (error) {
                log("Ошибка: " + error);
            }
        });
    </script>
</body>

</html>
